<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dispatch Barcode Scanner</title>
  
  <!-- Styling and Icons -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- High-Performance ZXing Barcode Engine for Code 128 & 1D Barcodes -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
</head>
<body class="bg-gray-100 min-h-screen p-4 md:p-8 text-gray-800">

  <div class="max-w-xl mx-auto bg-white rounded-xl shadow-md p-6 space-y-6">
    <h1 class="text-2xl font-bold text-center text-blue-600">
      <i class="fa-solid fa-boxes-packing mr-2"></i>Dispatch Scanner
    </h1>

    <!-- Dispatch Form -->
    <div class="space-y-4">
      
      <!-- Invoice Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Invoice Number (Code 128)</label>
        <div class="flex gap-2">
          <input type="text" id="invoiceNumber" placeholder="Scan or enter Invoice No." class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          <button onclick="openScanner('invoiceNumber')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
            <i class="fa-solid fa-camera"></i>
          </button>
        </div>
      </div>

      <!-- Courier Docket Number -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Courier Docket Number</label>
        <div class="flex gap-2">
          <input type="text" id="docketNumber" placeholder="Scan or enter Docket No." class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
          <button onclick="openScanner('docketNumber')" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700 transition">
            <i class="fa-solid fa-camera"></i>
          </button>
        </div>
      </div>

      <!-- Courier Partner -->
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">Courier Partner</label>
        <input type="text" id="courierPartner" placeholder="e.g. Shree Maruti, DTDC" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
      </div>

      <!-- Package Details -->
      <div class="grid grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Package Count</label>
          <input type="number" id="pkgCount" value="1" min="1" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Weight (kg)</label>
          <input type="text" id="totalWeight" placeholder="e.g. 2.5" class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-blue-500 outline-none">
        </div>
      </div>

      <!-- Action Buttons -->
      <div class="pt-2 flex gap-3">
        <button onclick="addEntry()" class="w-full bg-green-600 text-white font-semibold py-2 rounded-lg hover:bg-green-700 transition">
          <i class="fa-solid fa-plus mr-1"></i> Add Entry
        </button>
        <button onclick="downloadCSV()" class="w-full bg-slate-800 text-white font-semibold py-2 rounded-lg hover:bg-slate-900 transition">
          <i class="fa-solid fa-file-csv mr-1"></i> Export CSV
        </button>
      </div>

    </div>

    <!-- Logged Records Table -->
    <div class="mt-6 border-t pt-4">
      <h2 class="text-md font-semibold text-gray-700 mb-2">Current Session Log (<span id="logCount">0</span>)</h2>
      <div class="overflow-x-auto max-h-48 overflow-y-auto border rounded-lg">
        <table class="w-full text-left text-sm text-gray-600">
          <thead class="bg-gray-50 border-b text-xs uppercase font-medium">
            <tr>
              <th class="p-2">Invoice</th>
              <th class="p-2">Docket</th>
              <th class="p-2">Courier</th>
            </tr>
          </thead>
          <tbody id="logTableBody" class="divide-y">
            <!-- Dynamic rows will be inserted here -->
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <!-- Camera Modal Popup -->
  <div id="cameraModal" class="fixed inset-0 bg-black/70 flex items-center justify-center p-4 hidden z-50">
    <div class="bg-white rounded-xl p-4 max-w-sm w-full space-y-4 text-center shadow-2xl">
      <h3 class="font-bold text-gray-800">Align Barcode in Camera View</h3>
      
      <!-- Video Element for ZXing Scanner -->
      <div class="relative w-full h-64 bg-black rounded-lg overflow-hidden">
        <video id="interactive" class="w-full h-full object-cover"></video>
      </div>

      <button onclick="closeScanner()" class="w-full bg-red-500 text-white font-semibold py-2 rounded-lg hover:bg-red-600 transition">
        Cancel / Close Camera
      </button>
    </div>
  </div>

  <!-- Application Logic -->
  <script>
    let activeInputId = null;
    let codeReader = null;
    const records = [];

    // Initialize ZXing Reader
    document.addEventListener('DOMContentLoaded', () => {
      codeReader = new ZXing.BrowserMultiFormatReader();
    });

    // Open Camera Scanner
    function openScanner(inputId) {
      activeInputId = inputId;
      document.getElementById('cameraModal').classList.remove('hidden');

      // Start decoding from active back camera
      codeReader.decodeFromVideoDevice(undefined, 'interactive', (result, err) => {
        if (result) {
          // Fill scanned barcode text into active input field
          document.getElementById(activeInputId).value = result.text;
          playBeep();
          closeScanner();
        }
      });
    }

    // Close Camera Scanner & Stop Camera Stream
    function closeScanner() {
      if (codeReader) {
        codeReader.reset();
      }
      document.getElementById('cameraModal').classList.add('hidden');
      activeInputId = null;
    }

    // Add Entry to Local Log
    function addEntry() {
      const inv = document.getElementById('invoiceNumber').value.trim();
      const docket = document.getElementById('docketNumber').value.trim();
      const courier = document.getElementById('courierPartner').value.trim();
      const count = document.getElementById('pkgCount').value.trim();
      const weight = document.getElementById('totalWeight').value.trim();

      if (!inv || !docket) {
        alert('Please scan or enter both Invoice Number and Courier Docket Number.');
        return;
      }

      records.push({ inv, docket, courier, count, weight });

      // Update UI Table
      const tbody = document.getElementById('logTableBody');
      const row = document.createElement('tr');
      row.innerHTML = `<td class="p-2 font-medium">${inv}</td><td class="p-2">${docket}</td><td class="p-2">${courier || '-'}</td>`;
      tbody.prepend(row);

      document.getElementById('logCount').innerText = records.length;

      // Reset form input fields for next box
      document.getElementById('invoiceNumber').value = '';
      document.getElementById('docketNumber').value = '';
      document.getElementById('invoiceNumber').focus();
    }

    // Export Logged Records to Normal Comma CSV
    function downloadCSV() {
      if (records.length === 0) {
        alert('No entries to export yet.');
        return;
      }

      // Standard Comma-Separated Headers
      let csvContent = "data:text/csv;charset=utf-8,Invoice Number,Courier Docket Number,Courier Partner,Packages Count,Total Weight\n";

      // Add Data Rows with standard comma formatting
      records.forEach(r => {
        csvContent += `"${r.inv}","${r.docket}","${r.courier}",${r.count},"${r.weight}"\n`;
      });

      // Trigger automatic file download
      const encodedUri = encodeURI(csvContent);
      const link = document.createElement("a");
      link.setAttribute("href", encodedUri);
      link.setAttribute("download", `Dispatch_Log_${new Date().toISOString().slice(0,10)}.csv`);
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);
    }

    // Audio feedback on barcode detection
    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, ctx.currentTime);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch (e) {
        // Audio playback prevented by browser policy if un-interacted
      }
    }
  </script>
</body>
</html>
