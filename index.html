<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Courier Dispatch Management System</title>
  
  <!-- Tailwind CSS & Font Awesome -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- ZXing Barcode Engine & JSZip -->
  <script src="https://unpkg.com/@zxing/library@latest"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

  <style>
    body { background-color: #0b0f19; color: #f3f4f6; font-family: system-ui, -apple-system, sans-serif; }
    .card { background-color: #111827; border: 1px solid #1f2937; }
    .input-field { background-color: #0b0f19; border: 1px solid #374151; color: #f3f4f6; }
    .input-field:focus { border-color: #3b82f6; outline: none; }
    .mode-radio:checked + label { background-color: #1e3a8a; border-color: #3b82f6; color: #60a5fa; }

    /* High contrast date picker styling */
    .date-picker-input {
      color: #facc15 !important; /* Bright Yellow */
      font-weight: 800;
      font-size: 0.95rem;
      background-color: #1e293b;
      border: 1px solid #facc15;
      padding: 0.35rem 0.6rem;
      border-radius: 0.5rem;
      color-scheme: dark;
    }

    /* Make browser built-in calendar icon clearly visible in yellow */
    .date-picker-input::-webkit-calendar-picker-indicator {
      filter: invert(0.8) sepia(1) saturate(5) hue-rotate(5deg);
      cursor: pointer;
      opacity: 1;
    }
  </style>
</head>
<body class="p-3 md:p-6 max-w-xl mx-auto space-y-4 pb-12">

  <!-- Active Batch & Date Selector -->
  <div class="card p-4 rounded-xl flex flex-col gap-3 shadow-lg">
    <div class="flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="bg-amber-500/20 text-yellow-400 p-2.5 rounded-lg border border-yellow-500/30">
          <i class="fa-solid fa-calendar-days text-2xl"></i>
        </div>
        <div>
          <p class="text-xs font-bold uppercase tracking-wider text-yellow-400 mb-1">Select Dispatch Date *</p>
          <!-- High Contrast Bright Yellow Date Picker -->
          <input type="date" id="dispatchDate" onchange="changeBatchDate()" oninput="changeBatchDate()" class="date-picker-input shadow-md">
        </div>
      </div>
      <span id="recordBadge" class="bg-yellow-900/40 text-yellow-300 text-xs font-bold px-3 py-1.5 rounded-full border border-yellow-600 shadow">0 Records</span>
    </div>
    <div class="text-xs text-gray-400 border-t border-gray-800 pt-2 flex justify-between items-center">
      <span>Active File: <b id="batchFileName" class="text-gray-200">Loading...</b></span>
      <button onclick="clearCurrentBatch()" class="text-red-400 hover:underline"><i class="fa-solid fa-trash-can mr-1"></i>Clear Day Log</button>
    </div>
  </div>

  <!-- Dispatch Entry Form -->
  <div class="card p-5 rounded-xl space-y-4 shadow-xl">
    <h2 class="text-sm font-bold text-yellow-400 tracking-wider uppercase flex items-center gap-2">
      <i class="fa-solid fa-circle-plus"></i> New Consignment Entry
    </h2>

    <!-- Workflow Selector -->
    <div>
      <label class="block text-xs font-bold uppercase text-gray-300 mb-2">Select Dispatch Workflow Case *</label>
      <div class="grid grid-cols-1 gap-2 text-xs">
        <div>
          <input type="radio" id="modeA" name="dispatchMode" value="A" checked onchange="handleModeChange()" class="hidden mode-radio">
          <label for="modeA" class="block p-2.5 rounded-lg border border-gray-800 bg-gray-900 cursor-pointer font-medium transition">
            <b>Option A:</b> 1 Invoice | 1 Package
          </label>
        </div>
        <div>
          <input type="radio" id="modeB" name="dispatchMode" value="B" onchange="handleModeChange()" class="hidden mode-radio">
          <label for="modeB" class="block p-2.5 rounded-lg border border-gray-800 bg-gray-900 cursor-pointer font-medium transition">
            <b>Option B:</b> 1 Invoice | Multi-Pkg | Multi-Docket
          </label>
        </div>
        <div>
          <input type="radio" id="modeC" name="dispatchMode" value="C" onchange="handleModeChange()" class="hidden mode-radio">
          <label for="modeC" class="block p-2.5 rounded-lg border border-gray-800 bg-gray-900 cursor-pointer font-medium transition">
            <b>Option C:</b> 1 Invoice | Multi-Pkg | Single Docket
          </label>
        </div>
        <div>
          <input type="radio" id="modeD" name="dispatchMode" value="D" onchange="handleModeChange()" class="hidden mode-radio">
          <label for="modeD" class="block p-2.5 rounded-lg border border-gray-800 bg-gray-900 cursor-pointer font-medium transition">
            <b>Option D:</b> Multi-Invoice | Single Package
          </label>
        </div>
      </div>
    </div>

    <div class="border-t border-gray-800 pt-3 space-y-4">
      <!-- 1. Invoice Number Section (First Field) -->
      <div id="invoiceSection"></div>

      <!-- 2. Courier Partner Section (Second Field) -->
      <div>
        <div class="flex justify-between items-center mb-2">
          <label class="block text-xs font-bold uppercase text-gray-300">Courier Partner *</label>
          <button onclick="toggleVendorManager()" class="text-xs text-yellow-400 hover:underline flex items-center gap-1 font-semibold">
            <i class="fa-solid fa-gear"></i> Manage Vendors
          </button>
        </div>
        <div id="vendorRadioGroup" class="grid grid-cols-2 gap-2"></div>
        
        <div id="vendorManagerPanel" class="hidden mt-3 p-3 bg-gray-900 border border-gray-700 rounded-lg space-y-2">
          <div class="flex gap-2">
            <input type="text" id="newVendorName" placeholder="New Courier Name" class="input-field w-full px-3 py-1.5 rounded text-xs">
            <button onclick="addVendor()" class="bg-green-600 text-white px-3 py-1.5 rounded text-xs font-bold">Add</button>
          </div>
          <div id="vendorManageList" class="space-y-1 max-h-32 overflow-y-auto pt-2 border-t border-gray-800"></div>
        </div>
      </div>

      <!-- 3+. Remaining Dynamic Form Controls (Package, Weight, Docket, Photos) -->
      <div id="dynamicFormContainer" class="space-y-4 border-t border-gray-800/60 pt-3"></div>
    </div>

    <!-- Submit Action Button -->
    <button id="addOrUpdateBtn" onclick="saveEntry()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-3 rounded-lg shadow-lg transition flex items-center justify-center gap-2 mt-4">
      <i class="fa-solid fa-check"></i> <span id="btnText">SAVE DISPATCH ENTRY</span>
    </button>
  </div>

  <!-- Today Log Table -->
  <div class="card p-4 rounded-xl space-y-3">
    <div class="flex justify-between items-center">
      <h3 class="text-xs font-bold text-gray-300 uppercase tracking-wider">
        <i class="fa-solid fa-list"></i> Batch Records Log
      </h3>
      <span class="text-xs text-gray-400">Photos: <b id="photoCountBadge" class="text-yellow-400">0 attached</b></span>
    </div>

    <div class="overflow-x-auto border border-gray-800 rounded-lg">
      <table class="w-full text-left text-xs">
        <thead class="bg-gray-800 text-gray-400 uppercase">
          <tr>
            <th class="p-2">Mode</th>
            <th class="p-2">Invoice #</th>
            <th class="p-2">Courier</th>
            <th class="p-2">Docket / Details</th>
            <th class="p-2 text-right">Action</th>
          </tr>
        </thead>
        <tbody id="entriesTableBody" class="divide-y divide-gray-800 text-gray-300"></tbody>
      </table>
    </div>

    <!-- Export & Share Section -->
    <div class="flex gap-2 pt-2">
      <button onclick="shareZipPackage()" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-bold py-2.5 rounded-lg text-sm flex items-center justify-center gap-2 shadow-lg">
        <i class="fa-solid fa-share-nodes"></i> Share ZIP Package (CSV + Photos)
      </button>
      <button onclick="downloadCSVOnly()" class="bg-gray-800 hover:bg-gray-700 text-gray-300 px-4 py-2.5 rounded-lg text-sm font-bold" title="Download CSV Only">
        <i class="fa-solid fa-file-csv"></i>
      </button>
    </div>
  </div>

  <!-- Barcode Scanner Modal -->
  <div id="scannerModal" class="fixed inset-0 bg-black/80 flex items-center justify-center p-4 hidden z-50">
    <div class="card p-4 rounded-xl max-w-sm w-full space-y-3 text-center shadow-2xl">
      <h3 class="font-bold text-sm text-gray-200">Align Barcode inside Frame</h3>
      <div class="relative w-full h-56 bg-black rounded-lg overflow-hidden border border-gray-700">
        <video id="cameraPreview" class="w-full h-full object-cover"></video>
      </div>
      <button onclick="stopScan()" class="w-full bg-red-600 hover:bg-red-500 text-white font-bold py-2 rounded-lg text-xs">
        Close Camera
      </button>
    </div>
  </div>

  <!-- Photo Capture Modal -->
  <div id="photoModal" class="fixed inset-0 bg-black/90 flex items-center justify-center p-4 hidden z-50">
    <div class="card p-4 rounded-xl max-w-sm w-full space-y-3 text-center">
      <h3 id="photoModalTitle" class="font-bold text-xs text-gray-300 uppercase">Capture Package Box Photo</h3>
      <div class="relative w-full h-64 bg-black rounded-lg overflow-hidden border border-gray-700">
        <video id="photoPreview" class="w-full h-full object-cover" autoplay playsinline></video>
      </div>
      <div class="flex gap-2">
        <button onclick="capturePhotoSnap()" class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-2 rounded-lg text-xs">
          <i class="fa-solid fa-camera mr-1"></i> Snap Photo
        </button>
        <button onclick="closePhotoModal()" class="bg-red-600 hover:bg-red-500 text-white font-bold px-4 py-2 rounded-lg text-xs">
          Cancel
        </button>
      </div>
    </div>
  </div>

  <canvas id="photoCanvas" class="hidden"></canvas>

  <script>
    let codeReader = null;
    let activeTargetId = null;
    let photoTargetKey = null;
    let photoStream = null;
    
    let vendors = JSON.parse(localStorage.getItem('courier_vendors')) || ['Shree Maruti', 'DTDC', 'ST COURIER', 'MARK'];
    let currentBatchDateStr = '';
    let currentBatchName = '';
    let entries = [];
    let photoStore = {};

    document.addEventListener('DOMContentLoaded', () => {
      const hints = new Map();
      hints.set(ZXing.DecodeHintType.POSSIBLE_FORMATS, [ZXing.BarcodeFormat.CODE_128]);
      hints.set(ZXing.DecodeHintType.TRY_HARDER, true);
      codeReader = new ZXing.BrowserMultiFormatReader(hints);

      // Default Date Picker to Today
      const today = new Date();
      const yyyy = today.getFullYear();
      const mm = String(today.getMonth() + 1).padStart(2, '0');
      const dd = String(today.getDate()).padStart(2, '0');
      document.getElementById('dispatchDate').value = `${yyyy}-${mm}-${dd}`;
      
      initBatchFile();
      renderVendors();
      handleModeChange();
      loadTodayEntries();
    });

    function initBatchFile() {
      let dateVal = document.getElementById('dispatchDate').value;
      if (!dateVal) {
        const today = new Date();
        const yyyy = today.getFullYear();
        const mm = String(today.getMonth() + 1).padStart(2, '0');
        const dd = String(today.getDate()).padStart(2, '0');
        dateVal = `${yyyy}-${mm}-${dd}`;
        document.getElementById('dispatchDate').value = dateVal;
      }
      
      const parts = dateVal.split('-');
      currentBatchDateStr = `${parts[2]}_${parts[1]}_${parts[0]}`; // DD_MM_YYYY
      currentBatchName = `Courier details for- ${currentBatchDateStr}.csv`;
      document.getElementById('batchFileName').innerText = currentBatchName;
    }

    function changeBatchDate() {
      initBatchFile();
      loadTodayEntries();
    }

    function handleModeChange() {
      const mode = document.querySelector('input[name="dispatchMode"]:checked').value;
      const invContainer = document.getElementById('invoiceSection');
      const container = document.getElementById('dynamicFormContainer');
      
      invContainer.innerHTML = '';
      container.innerHTML = '';

      // Field 1: Invoice Number Section
      if (mode === 'D') {
        invContainer.innerHTML = `
          <div>
            <div class="flex justify-between items-center mb-1">
              <label class="block text-xs font-bold uppercase text-gray-300">Invoice Numbers *</label>
              <button onclick="addInvoiceFieldD()" class="text-xs text-yellow-400 font-bold hover:underline">+ Add Invoice</button>
            </div>
            <div id="multiInvoiceContainerD" class="space-y-2"></div>
          </div>
        `;
        addInvoiceFieldD();
        addInvoiceFieldD();
      } else {
        invContainer.innerHTML = `
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Invoice Number *</label>
            <div class="flex gap-2">
              <input type="text" id="inv_1" placeholder="Scan or enter Invoice #" class="input-field w-full px-3 py-2 rounded-lg text-sm">
              <button onclick="startScan('inv_1')" class="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold text-xs shrink-0"><i class="fa-solid fa-camera"></i> Scan</button>
            </div>
          </div>
        `;
      }

      // Field 3+: Dynamic mode fields
      if (mode === 'A') {
        container.innerHTML = `
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold uppercase text-gray-300 mb-1">No. of Packages</label>
              <input type="number" value="1" disabled class="input-field w-full px-3 py-2 rounded-lg text-sm bg-gray-800 text-gray-400 cursor-not-allowed">
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Gross Weight (KG) *</label>
              <input type="number" step="0.01" id="weight_1" placeholder="e.g. 1.5" class="input-field w-full px-3 py-2 rounded-lg text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Courier Docket Number *</label>
            <div class="flex gap-2">
              <input type="text" id="docket_1" placeholder="Scan or enter Docket #" class="input-field w-full px-3 py-2 rounded-lg text-sm">
              <button onclick="startScan('docket_1')" class="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold text-xs shrink-0"><i class="fa-solid fa-camera"></i> Scan</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Box Photo Attachment</label>
            <button onclick="openPhotoModal('pack1')" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-2">
              <i class="fa-solid fa-camera text-yellow-400"></i> <span id="photoBtnLabel_pack1">Take Photo (pack1)</span>
            </button>
          </div>
        `;
      } else if (mode === 'B') {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">No. of Packages *</label>
            <input type="number" id="multiPkgCount" value="2" min="2" oninput="renderMultiPkgFieldsB()" class="input-field w-full px-3 py-2 rounded-lg text-sm">
          </div>
          <div id="multiPkgContainerB" class="space-y-3"></div>
        `;
        renderMultiPkgFieldsB();
      } else if (mode === 'C') {
        container.innerHTML = `
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Courier Docket Number *</label>
            <div class="flex gap-2">
              <input type="text" id="docket_1" placeholder="Scan or enter Docket #" class="input-field w-full px-3 py-2 rounded-lg text-sm">
              <button onclick="startScan('docket_1')" class="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold text-xs shrink-0"><i class="fa-solid fa-camera"></i> Scan</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">No. of Packages *</label>
            <input type="number" id="multiPkgCountC" value="2" min="2" oninput="renderMultiPkgFieldsC()" class="input-field w-full px-3 py-2 rounded-lg text-sm">
          </div>
          <div id="multiPkgContainerC" class="space-y-3"></div>
        `;
        renderMultiPkgFieldsC();
      } else if (mode === 'D') {
        container.innerHTML = `
          <div class="grid grid-cols-2 gap-2">
            <div>
              <label class="block text-xs font-bold uppercase text-gray-300 mb-1">No. of Packages</label>
              <input type="number" value="1" disabled class="input-field w-full px-3 py-2 rounded-lg text-sm bg-gray-800 text-gray-400 cursor-not-allowed">
            </div>
            <div>
              <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Gross Weight (KG) *</label>
              <input type="number" step="0.01" id="weight_1" placeholder="e.g. 2.5" class="input-field w-full px-3 py-2 rounded-lg text-sm">
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Courier Docket Number *</label>
            <div class="flex gap-2">
              <input type="text" id="docket_1" placeholder="Scan or enter Docket #" class="input-field w-full px-3 py-2 rounded-lg text-sm">
              <button onclick="startScan('docket_1')" class="bg-blue-600 text-white px-3 py-2 rounded-lg font-bold text-xs shrink-0"><i class="fa-solid fa-camera"></i> Scan</button>
            </div>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase text-gray-300 mb-1">Box Photo Attachment</label>
            <button onclick="openPhotoModal('pack1')" class="w-full bg-gray-800 hover:bg-gray-700 text-gray-300 border border-gray-700 py-2 rounded-lg text-xs font-bold flex items-center justify-center gap-2">
              <i class="fa-solid fa-camera text-yellow-400"></i> <span id="photoBtnLabel_pack1">Take Photo (pack1)</span>
            </button>
          </div>
        `;
      }
    }

    function renderMultiPkgFieldsB() {
      const count = parseInt(document.getElementById('multiPkgCount').value) || 2;
      const container = document.getElementById('multiPkgContainerB');
      container.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const div = document.createElement('div');
        div.className = "p-3 bg-gray-900 border border-gray-800 rounded-lg space-y-2";
        div.innerHTML = `
          <p class="text-xs font-bold text-yellow-400">Package - ${i}</p>
          <div class="flex gap-2">
            <input type="text" id="docket_pkg_${i}" placeholder="Docket # for Pkg ${i}" class="input-field w-full px-3 py-1.5 rounded text-xs">
            <button onclick="startScan('docket_pkg_${i}')" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs shrink-0"><i class="fa-solid fa-camera"></i></button>
          </div>
          <div class="flex gap-2 items-center">
            <input type="number" step="0.01" id="weight_pkg_${i}" placeholder="Weight (kg)" class="input-field w-full px-3 py-1.5 rounded text-xs">
            <button onclick="openPhotoModal('pack${i}')" class="bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1.5 rounded text-xs shrink-0 font-bold">
              <i class="fa-solid fa-camera text-yellow-400"></i> <span id="photoBtnLabel_pack${i}">Photo</span>
            </button>
          </div>
        `;
        container.appendChild(div);
      }
    }

    function renderMultiPkgFieldsC() {
      const count = parseInt(document.getElementById('multiPkgCountC').value) || 2;
      const container = document.getElementById('multiPkgContainerC');
      container.innerHTML = '';
      for (let i = 1; i <= count; i++) {
        const div = document.createElement('div');
        div.className = "p-3 bg-gray-900 border border-gray-800 rounded-lg space-y-2";
        div.innerHTML = `
          <p class="text-xs font-bold text-yellow-400">Package - ${i}</p>
          <div class="flex gap-2 items-center">
            <input type="number" step="0.01" id="weight_pkg_${i}" placeholder="Weight (kg) for Pkg ${i}" class="input-field w-full px-3 py-1.5 rounded text-xs">
            <button onclick="openPhotoModal('pack${i}')" class="bg-gray-800 text-gray-300 border border-gray-700 px-3 py-1.5 rounded text-xs shrink-0 font-bold">
              <i class="fa-solid fa-camera text-yellow-400"></i> <span id="photoBtnLabel_pack${i}">Photo</span>
            </button>
          </div>
        `;
        container.appendChild(div);
      }
    }

    let invoiceCountD = 0;
    function addInvoiceFieldD() {
      invoiceCountD++;
      const container = document.getElementById('multiInvoiceContainerD');
      const div = document.createElement('div');
      div.id = `invGroupD_${invoiceCountD}`;
      div.className = "flex gap-2 items-center";
      div.innerHTML = `
        <input type="text" id="inv_D_${invoiceCountD}" placeholder="Invoice Number ${invoiceCountD}" class="input-field inv-field-d w-full px-3 py-1.5 rounded text-xs">
        <button onclick="startScan('inv_D_${invoiceCountD}')" class="bg-blue-600 text-white px-3 py-1.5 rounded text-xs shrink-0"><i class="fa-solid fa-camera"></i></button>
      `;
      container.appendChild(div);
    }

    async function startScan(inputId) {
      activeTargetId = inputId;
      document.getElementById('scannerModal').classList.remove('hidden');
      const constraints = {
        video: { facingMode: "environment", width: { ideal: 1920 }, height: { ideal: 1080 } }
      };
      try {
        await codeReader.decodeFromConstraints(constraints, 'cameraPreview', (result) => {
          if (result) {
            document.getElementById(activeTargetId).value = result.text;
            playBeep();
            stopScan();
          }
        });
      } catch (e) {
        codeReader.decodeFromVideoDevice(undefined, 'cameraPreview', (result) => {
          if (result) {
            document.getElementById(activeTargetId).value = result.text;
            playBeep();
            stopScan();
          }
        });
      }
    }

    function stopScan() {
      if (codeReader) codeReader.reset();
      document.getElementById('scannerModal').classList.add('hidden');
    }

    async function openPhotoModal(packKey) {
      photoTargetKey = packKey;
      document.getElementById('photoModal').classList.remove('hidden');
      try {
        photoStream = await navigator.mediaDevices.getUserMedia({
          video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } }
        });
        document.getElementById('photoPreview').srcObject = photoStream;
      } catch (e) {
        alert('Could not open camera for photo: ' + e.message);
        closePhotoModal();
      }
    }

    function capturePhotoSnap() {
      const video = document.getElementById('photoPreview');
      const canvas = document.getElementById('photoCanvas');
      canvas.width = 640;
      canvas.height = 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(video, 0, 0, 640, 480);
      
      const base64Img = canvas.toDataURL('image/jpeg', 0.6);
      photoStore[photoTargetKey] = base64Img;

      const labelBtn = document.getElementById(`photoBtnLabel_${photoTargetKey}`);
      if (labelBtn) labelBtn.innerText = 'Saved ✓';

      closePhotoModal();
    }

    function closePhotoModal() {
      if (photoStream) {
        photoStream.getTracks().forEach(t => t.stop());
      }
      document.getElementById('photoModal').classList.add('hidden');
    }

    function renderVendors() {
      const group = document.getElementById('vendorRadioGroup');
      const manageList = document.getElementById('vendorManageList');
      group.innerHTML = '';
      manageList.innerHTML = '';
      vendors.forEach((v, idx) => {
        const label = document.createElement('label');
        label.className = "flex items-center gap-2 p-2 rounded-lg border border-gray-800 bg-gray-900 cursor-pointer text-xs";
        label.innerHTML = `<input type="radio" name="courierPartner" value="${v}" class="text-blue-600"> <span>${v}</span>`;
        group.appendChild(label);

        const item = document.createElement('div');
        item.className = "flex justify-between items-center text-xs text-gray-300 py-1";
        item.innerHTML = `<span>${v}</span> <button onclick="deleteVendor(${idx})" class="text-red-400"><i class="fa-solid fa-trash"></i></button>`;
        manageList.appendChild(item);
      });
      localStorage.setItem('courier_vendors', JSON.stringify(vendors));
    }

    function toggleVendorManager() {
      document.getElementById('vendorManagerPanel').classList.toggle('hidden');
    }

    function addVendor() {
      const val = document.getElementById('newVendorName').value.trim();
      if (val && !vendors.includes(val)) {
        vendors.push(val);
        document.getElementById('newVendorName').value = '';
        renderVendors();
      }
    }

    function deleteVendor(idx) {
      vendors.splice(idx, 1);
      renderVendors();
    }

    function saveEntry() {
      const mode = document.querySelector('input[name="dispatchMode"]:checked').value;
      const selectedRadio = document.querySelector('input[name="courierPartner"]:checked');
      if (!selectedRadio) return alert('Please select a Courier Partner');
      const courier = selectedRadio.value;

      let entryObj = { mode, courier, date: currentBatchDateStr, photos: { ...photoStore } };

      if (mode === 'A') {
        const inv = document.getElementById('inv_1').value.trim();
        const weight = document.getElementById('weight_1').value.trim();
        const docket = document.getElementById('docket_1').value.trim();
        if (!inv || !weight || !docket) return alert('Please fill in Invoice, Weight, and Docket Number.');
        
        entryObj.inv = inv;
        entryObj.docket = docket;
        entryObj.weight = weight;
      } else if (mode === 'B') {
        const inv = document.getElementById('inv_1').value.trim();
        const count = parseInt(document.getElementById('multiPkgCount').value) || 2;
        if (!inv) return alert('Please enter Invoice Number');
        
        let pkgDetails = [];
        for (let i = 1; i <= count; i++) {
          const doc = document.getElementById(`docket_pkg_${i}`).value.trim();
          const w = document.getElementById(`weight_pkg_${i}`).value.trim();
          if (!doc || !w) return alert(`Please enter Docket and Weight for Package ${i}`);
          pkgDetails.push(`Pck${i}-${doc}-${w}`);
        }
        entryObj.inv = inv;
        entryObj.pkgStr = pkgDetails.join(' || ');
      } else if (mode === 'C') {
        const inv = document.getElementById('inv_1').value.trim();
        const docket = document.getElementById('docket_1').value.trim();
        const count = parseInt(document.getElementById('multiPkgCountC').value) || 2;
        if (!inv || !docket) return alert('Please enter Invoice and Docket Number');

        let pkgWeights = [];
        let total = 0;
        for (let i = 1; i <= count; i++) {
          const w = document.getElementById(`weight_pkg_${i}`).value.trim();
          if (!w) return alert(`Please enter Weight for Package ${i}`);
          pkgWeights.push(`Pck${i}-${w}`);
          total += parseFloat(w) || 0;
        }
        entryObj.inv = inv;
        entryObj.docket = docket;
        entryObj.pkgStr = pkgWeights.join(' || ');
        entryObj.totalWeight = total.toFixed(2);
      } else if (mode === 'D') {
        const invInputs = document.querySelectorAll('.inv-field-d');
        let invs = Array.from(invInputs).map(inp => inp.value.trim()).filter(v => v !== '');
        const weight = document.getElementById('weight_1').value.trim();
        const docket = document.getElementById('docket_1').value.trim();
        if (invs.length === 0 || !weight || !docket) return alert('Please enter at least one Invoice, Weight, and Docket Number.');

        entryObj.invoices = invs;
        entryObj.docket = docket;
        entryObj.weight = weight;
      }

      entries.push(entryObj);
      saveEntriesToStorage();
      photoStore = {};
      handleModeChange();
      renderTable();
    }

    function saveEntriesToStorage() {
      localStorage.setItem(currentBatchName, JSON.stringify(entries));
    }

    function loadTodayEntries() {
      entries = JSON.parse(localStorage.getItem(currentBatchName)) || [];
      renderTable();
    }

    function renderTable() {
      const tbody = document.getElementById('entriesTableBody');
      tbody.innerHTML = '';
      document.getElementById('recordBadge').innerText = `${entries.length} Records`;

      let photoCount = 0;

      entries.forEach((e, idx) => {
        if (e.photos) photoCount += Object.keys(e.photos).length;

        const tr = document.createElement('tr');
        let invCol = e.inv || (e.invoices ? e.invoices.join(', ') : '-');
        let detailsCol = '';

        if (e.mode === 'A') detailsCol = `Docket: ${e.docket} (${e.weight}kg)`;
        else if (e.mode === 'B') detailsCol = e.pkgStr;
        else if (e.mode === 'C') detailsCol = `Doc: ${e.docket} | ${e.pkgStr} | Tot: ${e.totalWeight}kg`;
        else if (e.mode === 'D') detailsCol = `Doc: ${e.docket} (${e.weight}kg on 1st inv)`;

        tr.innerHTML = `
          <td class="p-2 font-bold text-yellow-400">Opt ${e.mode}</td>
          <td class="p-2 font-medium">${invCol}</td>
          <td class="p-2">${e.courier}</td>
          <td class="p-2 text-xs truncate max-w-xs">${detailsCol}</td>
          <td class="p-2 text-right">
            <button onclick="deleteEntry(${idx})" class="text-red-400"><i class="fa-solid fa-trash"></i></button>
          </td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('photoCountBadge').innerText = `${photoCount} attached`;
    }

    function deleteEntry(idx) {
      entries.splice(idx, 1);
      saveEntriesToStorage();
      renderTable();
    }

    function clearCurrentBatch() {
      if (confirm(`Are you sure you want to delete all entries for ${currentBatchDateStr}?`)) {
        localStorage.removeItem(currentBatchName);
        loadTodayEntries();
      }
    }

    function generateCSVString() {
      let csv = "Date,Invoice Number,Courier Partner Name,Docket Number,Package Details,Total Weight\n";
      entries.forEach(e => {
        if (e.mode === 'A') {
          csv += `"${e.date}","${e.inv}","${e.courier}","${e.docket}","1 Pkg","${e.weight}"\n`;
        } else if (e.mode === 'B') {
          csv += `"${e.date}","${e.inv}","${e.courier}","","${e.pkgStr}",""\n`;
        } else if (e.mode === 'C') {
          csv += `"${e.date}","${e.inv}","${e.courier}","${e.docket}","${e.pkgStr}","${e.totalWeight}"\n`;
        } else if (e.mode === 'D') {
          e.invoices.forEach((invNum, i) => {
            let weightVal = (i === 0) ? e.weight : "";
            csv += `"${e.date}","${invNum}","${e.courier}","${e.docket}","1 Pkg","${weightVal}"\n`;
          });
        }
      });
      return csv;
    }

    function downloadCSVOnly() {
      if (entries.length === 0) return alert('No records to export');
      const csv = generateCSVString();
      const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = currentBatchName;
      link.click();
    }

    async function shareZipPackage() {
      if (entries.length === 0) return alert('No records to share');

      const zip = new JSZip();
      const csvStr = generateCSVString();
      zip.file(currentBatchName, csvStr);

      const imgFolder = zip.folder("Box_Photos");

      entries.forEach(e => {
        if (e.photos) {
          Object.keys(e.photos).forEach(packKey => {
            const base64Data = e.photos[packKey].replace(/^data:image\/(png|jpeg);base64,/, "");
            let filename = "";

            if (e.mode === 'D') {
              filename = `${e.invoices[0]}_pack1.jpg`;
            } else {
              filename = `${e.inv}_${packKey}.jpg`;
            }
            imgFolder.file(filename, base64Data, { base64: true });
          });
        }
      });

      const content = await zip.generateAsync({ type: "blob" });
      const zipFileName = `Dispatch_Package_${currentBatchDateStr}.zip`;
      const zipFile = new File([content], zipFileName, { type: "application/zip" });

      if (navigator.canShare && navigator.canShare({ files: [zipFile] })) {
        try {
          await navigator.share({
            title: `Dispatch Reports ${currentBatchDateStr}`,
            text: `Courier Dispatch details and box photos for ${currentBatchDateStr}`,
            files: [zipFile]
          });
        } catch (err) {
          downloadBlob(content, zipFileName);
        }
      } else {
        downloadBlob(content, zipFileName);
      }
    }

    function downloadBlob(blob, filename) {
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = filename;
      link.click();
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.1);
      } catch(e) {}
    }
  </script>
</body>
</html>
